[nest]
name = "makerdao-dai"
chain = "mainnet"
chain_id = 1
# A keyless public endpoint, so this file is publishable: `nuthatch.toml` is pinned into the nest's
# content address and must never carry a credential. It is enough to follow the tip. A *backfill*
# needs archive depth this endpoint does not have - pass your own with `--rpc`, and check it first
# with `nuthatch doctor --rpc <url>`.
rpc_urls = [
    "https://eth.drpc.org",
]
schema_version = 1
block_timestamps = true

[[contracts]]
alias = "c0"
address = "0x6b175474e89094c44da98b954eedeac495271d0f"
start_block = 8928158
abi = "abis/c0.json"
